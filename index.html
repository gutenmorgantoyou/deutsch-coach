<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Deutsch Coach 🇩🇪</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    textarea,
    button {
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 10px;
    }

    select,
    textarea {
      border: 1px solid #ddd;
      padding: 12px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 13px;
      margin-top: 10px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button.secondary {
      background: #eee;
      color: #222;
    }

    button.danger {
      background: #b00020;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat {
      max-height: 520px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 14px;
      padding: 13px;
      border-radius: 12px;
      white-space: pre-wrap;
    }

    .user {
      background: #e8f0fe;
    }

    .assistant {
      background: #f1f1f1;
    }

    .message-label {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      margin-bottom: 5px;
    }

    .translation,
    .correction,
    .vocabulary {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
      font-size: 14px;
    }

    .word {
      margin: 6px 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      background: #f5f5f5;
      padding: 12px 5px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
    }

    .list-item {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .small {
      color: #666;
      font-size: 13px;
    }

    .status {
      margin-top: 8px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }

    .level-description {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    .skill-status {
      display: inline-block;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 8px;
      background: #eee;
      margin-left: 5px;
    }

    @media (max-width: 450px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="card">
    <h1>🇩🇪 Deutsch Coach</h1>
    <p class="subtitle">Dein persönlicher Deutsch-Coach</p>

    <label for="level">Dein Deutsch-Niveau</label>

    <select id="level">
      <option value="A1">A1 – Anfänger</option>
      <option value="A2">A2 – Grundkenntnisse</option>
      <option value="B1">B1 – Mittelstufe</option>
      <option value="B2">B2 – Gute Mittelstufe</option>
      <option value="C1">C1 – Fortgeschritten</option>
      <option value="C2">C2 – Sehr fortgeschritten</option>
    </select>

    <div id="levelDescription" class="level-description"></div>
  </div>


  <div class="card">

    <label for="topic">Thema</label>

    <select id="topic">
      <option value="">Freies Gespräch</option>
      <option value="Alltag">Alltag</option>
      <option value="Reisen">Reisen</option>
      <option value="Essen">Essen</option>
      <option value="Arbeit">Arbeit</option>
      <option value="Hobbys">Hobbys</option>
      <option value="Familie">Familie</option>
      <option value="Deutschland">Deutschland</option>
    </select>

  </div>


  <div class="card">

    <div id="chat" class="chat"></div>

    <textarea
      id="messageInput"
      placeholder="Schreibe etwas auf Deutsch..."
    ></textarea>

    <button id="sendButton" onclick="sendMessage()">
      Senden
    </button>

    <button
      id="speakButton"
      class="secondary"
      onclick="startSpeaking()"
    >
      🎙️ Sprechen
    </button>

    <button
      id="handsFreeButton"
      class="secondary"
      onclick="toggleHandsFree()"
    >
      🔄 Freisprechen: Aus
    </button>

    <div id="status" class="status"></div>

  </div>


  <div class="card">

    <h3>📊 Dein Fortschritt</h3>

    <div class="stats">

      <div class="stat">
        <div id="answersCount" class="stat-number">0</div>
        <div class="stat-label">Antworten</div>
      </div>

      <div class="stat">
        <div id="correctionsCount" class="stat-number">0</div>
        <div class="stat-label">Korrekturen</div>
      </div>

      <div class="stat">
        <div id="wordsCount" class="stat-number">0</div>
        <div class="stat-label">Wörter</div>
      </div>

      <div class="stat">
        <div id="streakCount" class="stat-number">0</div>
        <div class="stat-label">Lerntage</div>
      </div>

    </div>

  </div>


  <div class="card">

    <h3>📚 Meine Wörter</h3>

    <div id="vocabularyList"></div>

  </div>


  <div class="card">

    <h3>⚠️ Meine Fehler</h3>

    <div id="mistakesList"></div>

  </div>


  <div class="card">

    <h3>🧠 Meine Lernfähigkeiten</h3>

    <div id="skillsList"></div>

  </div>


  <div class="card">

    <h3>💾 Meine Daten</h3>

    <button onclick="exportData()">
      Daten exportieren
    </button>

    <button
      class="secondary"
      onclick="document.getElementById('importFile').click()"
    >
      Daten importieren
    </button>

    <input
      id="importFile"
      type="file"
      accept=".json"
      style="display:none"
      onchange="importData(event)"
    >

    <button
      class="danger"
      onclick="deleteData()"
    >
      Alle Daten löschen
    </button>

  </div>

</div>


<script>

const API_URL =
  "https://deutsch-coach-api.gutenmorgantoyou.workers.dev";

const STORAGE_KEY =
  "deutschCoachDataV4";


const LEVEL_DESCRIPTIONS = {

  A1:
    "Sehr einfache Gespräche mit kurzen Sätzen.",

  A2:
    "Einfache Gespräche über Alltag und bekannte Themen.",

  B1:
    "Normale Gespräche mit etwas komplexeren Sätzen.",

  B2:
    "Flüssigere Gespräche mit differenzierterem Deutsch.",

  C1:
    "Anspruchsvolle Gespräche mit komplexem Deutsch.",

  C2:
    "Sehr anspruchsvolle Gespräche mit präzisem und natürlichem Deutsch."

};


const DEFAULT_DATA = {

  level: "A1",

  topic: "",

  messages: [],

  vocabulary
