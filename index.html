<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deutsch Coach 🇩🇪</title>


    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .label {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .text {
            font-size: 20px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 20px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        button.listening {
            background: #d32f2f;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 16px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🇩🇪 Deutsch Coach</h1>

    <div class="card">
        <div class="label">Deutsch Coach</div>
        <div class="text" id="botText">
            Hallo! Wie geht es dir heute?
        </div>
    </div>

    <div class="card">
        <div class="label">Du</div>
        <div class="text" id="userText">
            —
        </div>
    </div>

    <button id="speakButton">
        🎙️ Sprechen
    </button>

    <div id="status">
        Bereit
    </div>

</div>

<script>

const speakButton = document.getElementById("speakButton");
const userText = document.getElementById("userText");
const botText = document.getElementById("botText");
const status = document.getElementById("status");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

const synth = window.speechSynthesis;

if (!SpeechRecognition) {

    status.textContent =
        "Spracherkennung wird von diesem Browser nicht unterstützt.";

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "de-DE";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    speakButton.onclick = () => {

        recognition.start();

        speakButton.classList.add("listening");

        speakButton.disabled = true;

        speakButton.textContent = "🎙️ Zuhören...";

        status.textContent = "Ich höre zu...";
    };


    recognition.onresult = (event) => {

        const text =
            event.results[0][0].transcript;

        userText.textContent = text;

        status.textContent = "Erkannt!";

        // Get bot response and speak it
        setTimeout(() => {
            getBotResponse(text);
        }, 500);
    };


    recognition.onerror = (event) => {

        console.log(event.error);

        status.textContent =
            "Fehler: " + event.error;

        speakButton.disabled = false;
    };


    recognition.onend = () => {

        speakButton.classList.remove("listening");

        speakButton.textContent =
            "🎙️ Sprechen";

        if (status.textContent === "Ich höre zu...") {
            status.textContent = "Bereit";
        }
    };

}

// Simple response system
function getBotResponse(userInput) {
    const responses = {
        "guten morgen": "Guten Morgen! Wie geht es dir?",
        "guten tag": "Guten Tag! Schön, dich zu sehen!",
        "guten abend": "Guten Abend! Wie war dein Tag?",
        "wie geht es dir": "Mir geht es gut, danke der Nachfrage! Und dir?",
        "mir geht es gut": "Das freut mich zu hören!",
        "danke": "Gerne! Alles klar?",
        "ja": "Sehr gut! Bis bald!",
        "nein": "Was ist denn los? Erzähl mir mehr!",
        "default": "Interessant! Kannst du das wiederhole n?"
    };

    const lowerInput = userInput.toLowerCase();
    let response = responses["default"];

    // Find matching response
    for (let key in responses) {
        if (lowerInput.includes(key)) {
            response = responses[key];
            break;
        }
    }

    // Update bot text
    botText.textContent = response;
    status.textContent = "Antworte...";

    // Speak the response
    speakResponse(response);
}

// Text-to-speech function
function speakResponse(text) {
    // Cancel any ongoing speech
    synth.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "de-DE";
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onend = () => {
        status.textContent = "Fertig! Sprich wieder.";
        speakButton.disabled = false;
    };

    utterance.onerror = (event) => {
        console.error("Speech error:", event.error);
        status.textContent = "Fehler beim Sprechen";
        speakButton.disabled = false;
    };

    synth.speak(utterance);
}

</script>

</body>
</html>
