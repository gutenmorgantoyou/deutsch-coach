<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Deutsch Coach 🇩🇪</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    .app {
        max-width: 600px;
        margin: auto;
        padding: 24px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .card {
        background: white;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 16px;
    }

    .label {
        font-size: 14px;
        color: #777;
        margin-bottom: 6px;
    }

    .text {
        font-size: 20px;
        line-height: 1.5;
    }

    .english {
        font-size: 16px;
        color: #666;
        line-height: 1.5;
        margin-top: 4px;
        margin-bottom: 16px;
    }

    .exchange-section {
        margin-bottom: 18px;
    }

    .exchange-section:last-child {
        margin-bottom: 0;
    }

    .german {
        font-size: 20px;
        line-height: 1.5;
    }

    .history-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 16px;
    }

    #conversation {
        margin-top: 20px;
    }

    .message {
        margin-bottom: 14px;
    }

    .message .speaker {
        font-size: 13px;
        color: #777;
        margin-bottom: 4px;
    }

    .message .bubble {
        background: #fff;
        border-radius: 12px;
        padding: 12px;
        line-height: 1.5;
    }

    .message.user .bubble {
        background: #e3f2fd;
    }

    .message.coach .bubble {
        background: #eeeeee;
    }

    button {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 18px;
        font-size: 20px;
        background: #1976d2;
        color: white;
        cursor: pointer;
    }

    button.listening {
        background: #d32f2f;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #status {
        text-align: center;
        margin-top: 16px;
        color: #666;
    }
</style>

</head><body><div class="app"><h1>🇩🇪 Deutsch Coach</h1>


<!-- Latest exchange -->

<div class="card">

    <div class="card-title">
        Letzter Austausch
    </div>


    <div class="exchange-section">

        <div class="label">
            Du
        </div>

        <div
            class="german"
            id="latestUserGerman"
        >
            —
        </div>

        <div
            class="english"
            id="latestUserEnglish"
        >
            🇬🇧 —
        </div>

    </div>


    <div class="exchange-section">

        <div class="label">
            Deutsch Coach
        </div>

        <div
            class="german"
            id="latestCoachGerman"
        >
            Hallo! Wie geht es dir heute?
        </div>

        <div
            class="english"
            id="latestCoachEnglish"
        >
            🇬🇧 Hello! How are you today?
        </div>

    </div>

</div>


<!-- Conversation history -->

<div class="card">

    <div class="history-title">
        Gespräch
    </div>

    <div id="conversation">

        <div class="message coach">

            <div class="speaker">
                Deutsch Coach
            </div>

            <div class="bubble">
                Hallo! Wie geht es dir heute?
            </div>

        </div>

    </div>

</div>


<button id="speakButton">
    🎙️ Sprechen
</button>

<div id="status">
    Bereit
</div>

</div><script>

const speakButton =
    document.getElementById("speakButton");

const status =
    document.getElementById("status");

const conversation =
    document.getElementById("conversation");

const latestUserGerman =
    document.getElementById("latestUserGerman");

const latestUserEnglish =
    document.getElementById("latestUserEnglish");

const latestCoachGerman =
    document.getElementById("latestCoachGerman");

const latestCoachEnglish =
    document.getElementById("latestCoachEnglish");


const API_URL =
    "https://deutsch-coach-api.gutenmorgantoyou.workers.dev";


const messages = [
    {
        role: "assistant",
        content:
            "Hallo! Wie geht es dir heute?"
    }
];


function addMessage(
    speaker,
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.innerHTML = `
        <div class="speaker">
            ${speaker}
        </div>

        <div class="bubble"></div>
    `;

    message.querySelector(
        ".bubble"
    ).textContent = text;

    conversation.appendChild(message);

    window.scrollTo({
        top:
            document.body.scrollHeight,
        behavior:
            "smooth"
    });
}


function speakGerman(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang =
        "de-DE";

    speech.rate =
        0.9;

    speech.pitch =
        1;

    window.speechSynthesis.speak(
        speech
    );
}


async function askCoach() {

    status.textContent =
        "🤔 Ich denke...";

    speakButton.disabled =
        true;

    try {

        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            messages:
                                messages
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );
        }


        if (!data.reply) {

            throw new Error(
                "Keine Antwort vom Coach."
            );
        }


        messages.push({
            role:
                "assistant",

            content:
                data.reply
        });


        /*
         * Update latest exchange.
         */

        latestCoachGerman.textContent =
            data.reply;

        latestCoachEnglish.textContent =
            "🇬🇧 " +
            (
                data.replyEnglish ||
                "Translation unavailable."
            );


        /*
         * Add German response
         * to conversation history.
         */

        addMessage(
            "Deutsch Coach",
            data.reply,
            "coach"
        );


        /*
         * Speak German response.
         */

        speakGerman(
            data.reply
        );


        status.textContent =
            "Bereit";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Fehler: " +
            error.message;

    } finally {

        speakButton.disabled =
            false;
    }
}


const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
        "Spracherkennung wird von diesem Browser nicht unterstützt.";

    speakButton.disabled =
        true;

} else {

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        "de-DE";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    speakButton.onclick =
        () => {

            try {

                window.speechSynthesis.cancel();

                recognition.start();

                speakButton.classList.add(
                    "listening"
                );

                speakButton.textContent =
                    "🎙️ Zuhören...";

                status.textContent =
                    "Ich höre zu...";

            } catch (error) {

                console.error(error);
            }
        };


    recognition.onresult =
        async (event) => {

            const text =
                event
                    .results[0][0]
                    .transcript;


            /*
             * Add learner message
             * to conversation history.
             */

            messages.push({
                role:
                    "user",

                content:
                    text
            });


            /*
             * Show learner's German
             * immediately.
             */

            latestUserGerman.textContent =
                text;

            latestUserEnglish.textContent =
                "🇬🇧 Übersetzung wird geladen...";


            /*
             * Show learner message
             * in German history.
             */

            addMessage(
                "Du",
                text,
                "user"
            );


            /*
             * Ask AI for response
             * and translations.
             */

            await askCoach();

            /*
             * The Worker returns the
             * English translation of
             * the learner's sentence.
             */

            /*
             * askCoach has already received
             * the response, so we need to
             * request the translation through
             * the returned data.
             */

        };


    recognition.onerror =
        (event) => {

            console.log(
                "Speech error:",
                event.error
            );

            if (
                event.error ===
                "not-allowed"
            ) {

                status.textContent =
                    "Mikrofonzugriff wurde verweigert.";

            } else if (
                event.error ===
                "no-speech"
            ) {

                status.textContent =
                    "Ich habe nichts gehört.";

            } else {

                status.textContent =
                    "Fehler: " +
                    event.error;
            }
        };


    recognition.onend =
        () => {

            speakButton.classList.remove(
                "listening"
            );

            speakButton.textContent =
                "🎙️ Sprechen";
        };

}

</script></body>
</html>
