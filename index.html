<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deutsch Coach 🇩🇪</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
        }

        .conversation-title {
            font-size: 15px;
            color: #777;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .message {
            margin-bottom: 18px;
        }

        .message .speaker {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .message .bubble {
            background: white;
            border-radius: 12px;
            padding: 14px;
            line-height: 1.5;
            font-size: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .message.user .bubble {
            background: #e3f2fd;
        }

        .message.coach .bubble {
            background: #eeeeee;
        }

        .translation {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
            padding-left: 4px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 20px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            margin-top: 8px;
        }

        button.listening {
            background: #d32f2f;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            text-align: center;
            margin-top: 16px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🇩🇪 Deutsch Coach</h1>

    <div class="conversation-title">
        Gespräch
    </div>

    <div id="conversation">

        <div class="message coach">

            <div class="speaker">
                Deutsch Coach
            </div>

            <div class="bubble">
                Hallo! Wie geht es dir heute?
            </div>

            <div class="translation">
                🇬🇧 Hello! How are you today?
            </div>

        </div>

    </div>


    <button id="speakButton">
        🎙️ Sprechen
    </button>


    <div id="status">
        Bereit
    </div>

</div>


<script>

const speakButton =
    document.getElementById("speakButton");

const status =
    document.getElementById("status");

const conversation =
    document.getElementById("conversation");


/*
 * Your Cloudflare Worker
 */

const API_URL =
    "https://deutsch-coach-api.gutenmorgantoyou.workers.dev";


/*
 * IMPORTANT:
 *
 * This array is the conversation memory.
 *
 * It contains ONLY the German conversation.
 *
 * English translations are NOT added here.
 *
 * This means the AI continues to receive
 * the full conversation context.
 */

const messages = [

    {
        role: "assistant",
        content:
            "Hallo! Wie geht es dir heute?"
    }

];


/*
 * Add a message to the conversation.
 *
 * German text is displayed first.
 * English translation is displayed underneath.
 */

function addMessage(
    speaker,
    text,
    type,
    translation = ""
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const speakerElement =
        document.createElement("div");

    speakerElement.className =
        "speaker";

    speakerElement.textContent =
        speaker;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(
        speakerElement
    );

    message.appendChild(
        bubble
    );


    /*
     * English translation.
     */

    if (translation) {

        const translationElement =
            document.createElement("div");

        translationElement.className =
            "translation";

        translationElement.textContent =
            "🇬🇧 " + translation;

        message.appendChild(
            translationElement
        );

    }


    conversation.appendChild(
        message
    );


    /*
     * Scroll to newest message.
     */

    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


/*
 * Translate a German sentence
 * into English.
 *
 * This request does NOT affect
 * the conversation history.
 */

async function translateToEnglish(text) {

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    translate: true,

                    text: text

                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Translation error"
            );

        }


        if (
            !data.translation
        ) {

            throw new Error(
                "No translation returned."
            );

        }


        return data.translation.trim();


    } catch (error) {

        console.error(
            "Translation error:",
            error
        );

        return "Translation unavailable.";

    }

}


/*
 * Speak German using the phone's
 * built-in speech synthesis.
 */

function speakGerman(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "de-DE";

    speech.rate =
        0.9;

    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/*
 * Ask the AI Coach.
 */

async function askCoach() {

    status.textContent =
        "🤔 Ich denke...";


    speakButton.disabled =
        true;


    try {

        /*
         * Send the complete conversation
         * history to the Worker.
         *
         * The Worker then sends it to
         * OpenRouter.
         */

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    messages:
                        messages

                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        if (!data.reply) {

            throw new Error(
                "Keine Antwort vom Coach."
            );

        }


        /*
         * IMPORTANT:
         *
         * Add the AI response to
         * conversation memory.
         */

        messages.push({

            role:
                "assistant",

            content:
                data.reply

        });


        /*
         * Get English translation.
         *
         * This is ONLY for display.
         */

        const translation =
            await translateToEnglish(
                data.reply
            );


        /*
         * Add German + English
         * to the visible conversation.
         */

        addMessage(

            "Deutsch Coach",

            data.reply,

            "coach",

            translation

        );


        /*
         * Speak German response.
         */

        speakGerman(
            data.reply
        );


        status.textContent =
            "Bereit";


    } catch (error) {

        console.error(error);


        status.textContent =
            "Fehler: " +
            error.message;


    } finally {

        speakButton.disabled =
            false;

    }

}


/*
 * Speech recognition.
 */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
        "Spracherkennung wird von diesem Browser nicht unterstützt.";

    speakButton.disabled =
        true;


} else {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "de-DE";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    /*
     * Start microphone.
     */

    speakButton.onclick =
        () => {

            try {

                /*
                 * Stop any current
                 * coach speech.
                 */

                window.speechSynthesis.cancel();


                recognition.start();


                speakButton.classList.add(
                    "listening"
                );


                speakButton.textContent =
                    "🎙️ Zuhören...";


                status.textContent =
                    "Ich höre zu...";


            } catch (error) {

                console.error(
                    error
                );

            }

        };


    /*
     * Speech recognized.
     */

    recognition.onresult =
        async (event) => {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if (!text) {

                return;

            }


            /*
             * IMPORTANT:
             *
             * Add learner's German
             * to conversation memory.
             *
             * English translation is NOT
             * stored in messages.
             */

            messages.push({

                role:
                    "user",

                content:
                    text

            });


            /*
             * Translate learner's sentence.
             *
             * Translation is visual only.
             */

            const translation =
                await translateToEnglish(
                    text
                );


            /*
             * Show learner's German +
             * English translation.
             */

            addMessage(

                "Du",

                text,

                "user",

                translation

            );


            /*
             * Ask the AI Coach.
             */

            await askCoach();

        };


    /*
     * Speech recognition errors.
     */

    recognition.onerror =
        (event) => {

            console.log(
                "Speech error:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                status.textContent =
                    "Mikrofonzugriff wurde verweigert.";


            } else if (
                event.error ===
                "no-speech"
            ) {

                status.textContent =
                    "Ich habe nichts gehört.";


            } else {

                status.textContent =
                    "Fehler: " +
                    event.error;

            }

        };


    /*
     * Recognition finished.
     */

    recognition.onend =
        () => {

            speakButton.classList.remove(
                "listening"
            );


            speakButton.textContent =
                "🎙️ Sprechen";

        };

}

</script>

</body>
</html>
