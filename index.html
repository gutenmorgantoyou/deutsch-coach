<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch Coach 🇩🇪</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      margin-top: 8px;
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select,
    textarea,
    button {
      width: 100%;
      font-size: 16px;
      border-radius: 10px;
    }

    select,
    textarea {
      border: 1px solid #ccc;
      padding: 12px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 13px;
      margin-top: 9px;
      cursor: pointer;
      background: #222;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .voice {
      background: #444;
    }

    .handsfree-on {
      background: #167c3a;
    }

    .danger {
      background: #b42318;
    }

    .message {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .user {
      background: #e8f0fe;
    }

    .assistant {
      background: #f1f1f1;
    }

    .translation {
      color: #666;
      font-size: 14px;
      margin-top: 7px;
    }

    .correction {
      margin-top: 10px;
      padding: 10px;
      background: #fff8dc;
      border-radius: 9px;
      font-size: 14px;
    }

    .vocab {
      margin-top: 8px;
      padding: 9px;
      background: #eef8ee;
      border-radius: 9px;
      font-size: 14px;
    }

    .status {
      min-height: 22px;
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }

    .error {
      color: #b42318;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat {
      background: #f5f5f5;
      padding: 12px 5px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-number {
      font-size: 21px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .word-item,
    .mistake-item,
    .skill-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .word-item:last-child,
    .mistake-item:last-child,
    .skill-item:last-child {
      border-bottom: none;
    }

    .small {
      font-size: 13px;
      color: #666;
    }

    .empty {
      color: #888;
      font-size: 14px;
    }

    .level-description {
      margin-top: 7px;
      color: #666;
      font-size: 14px;
    }

    .list-title {
      font-weight: bold;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 7px;
      border-radius: 8px;
      background: #eee;
      font-size: 12px;
      margin-left: 5px;
    }

    .recording {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.55;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🇩🇪 Deutsch Coach</h1>
  <div class="subtitle">Dein persönlicher Deutsch-Coach</div>

  <!-- LEVEL -->
  <div class="card">

    <label for="level">🎯 Dein Deutsch-Niveau</label>

    <select id="level">
      <option value="A1">A1 – Anfänger</option>
      <option value="A2">A2 – Grundkenntnisse</option>
      <option value="B1">B1 – Mittelstufe</option>
      <option value="B2">B2 – Gute Mittelstufe</option>
      <option value="C1">C1 – Fortgeschritten</option>
      <option value="C2">C2 – Nahezu muttersprachlich</option>
    </select>

    <div id="levelDescription" class="level-description"></div>

  </div>

  <!-- TOPIC -->
  <div class="card">

    <label for="topic">💬 Thema</label>

    <select id="topic">
      <option value="">Freies Gespräch</option>
      <option value="Alltag">Alltag</option>
      <option value="Reisen">Reisen</option>
      <option value="Essen">Essen</option>
      <option value="Arbeit">Arbeit</option>
      <option value="Hobbys">Hobbys</option>
      <option value="Familie">Familie</option>
      <option value="Deutschland">Deutschland</option>
    </select>

  </div>

  <!-- CHAT -->
  <div class="card">

    <h2>💬 Gespräch</h2>

    <div id="chat"></div>

    <textarea
      id="messageInput"
      placeholder="Schreibe etwas auf Deutsch..."
    ></textarea>

    <button id="sendButton">
      Senden
    </button>

    <button id="voiceButton" class="voice">
      🎙️ Sprechen
    </button>

    <button id="handsFreeButton" class="secondary">
      🔄 Freisprechen: Aus
    </button>

    <button id="newConversationButton" class="secondary">
      🆕 Neues Gespräch
    </button>

    <div id="status" class="status"></div>

  </div>

  <!-- PROGRESS -->
  <div class="card">

    <h2>📊 Fortschritt</h2>

    <div class="stats">

      <div class="stat">
        <div id="answersCount" class="stat-number">0</div>
        <div class="stat-label">Antworten</div>
      </div>

      <div class="stat">
        <div id="correctionsCount" class="stat-number">0</div>
        <div class="stat-label">Korrekturen</div>
      </div>

      <div class="stat">
        <div id="wordsCount" class="stat-number">0</div>
        <div class="stat-label">Wörter</div>
      </div>

      <div class="stat">
        <div id="streakCount" class="stat-number">0</div>
        <div class="stat-label">Lerntage</div>
      </div>

    </div>

  </div>

  <!-- VOCABULARY -->
  <div class="card">

    <h2>📚 Meine Wörter</h2>

    <div id="vocabularyList"></div>

  </div>

  <!-- MISTAKES -->
  <div class="card">

    <h2>✏️ Meine Fehler</h2>

    <div id="mistakesList"></div>

  </div>

  <!-- LEARNING PROFILE -->
  <div class="card">

    <h2>🧠 Mein Lernprofil</h2>

    <div id="learningProfileList"></div>

  </div>

  <!-- DATA -->
  <div class="card">

    <h2>💾 Meine Daten</h2>

    <button id="exportButton" class="secondary">
      Daten exportieren
    </button>

    <button id="importButton" class="secondary">
      Daten importieren
    </button>

    <input
      id="importFile"
      type="file"
      accept=".json,application/json"
      style="display:none"
    >

    <button id="deleteDataButton" class="danger">
      Alle Daten löschen
    </button>

  </div>

</div>

<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const API_URL =
    "https://deutsch-coach-api.gutenmorgantoyou.workers.dev";

  const STORAGE_KEY =
    "deutschCoachDataV4";


  /* =========================================================
     LEVEL INFORMATION
  ========================================================= */

  const LEVEL_DESCRIPTIONS = {

    A1:
      "Sehr einfache Gespräche und kurze Sätze.",

    A2:
      "Einfache Gespräche über Alltag und bekannte Themen.",

    B1:
      "Selbstständige Gespräche über viele Alltagsthemen.",

    B2:
      "Flüssigere Gespräche mit komplexeren Strukturen.",

    C1:
      "Anspruchsvolle Gespräche mit komplexem Deutsch.",

    C2:
      "Sehr präzises und nahezu muttersprachliches Deutsch."

  };


  /* =========================================================
     DEFAULT DATA
  ========================================================= */

  const defaultData = {

    level: "A1",

    topic: "",

    messages: [],

    vocabulary: [],

    mistakes: [],

    sessions: 0,

    corrections: 0,

    streak: 0,

    lastStudyDate: "",

    handsFree: false,

    learningProfile: {

      skills: {},

      recentTopics: [],

      recentQuestions: []

    }

  };


  let data = loadData();

  let recognition = null;

  let isListening = false;

  let isSpeaking = false;

  let isSending = false;

  let handsFreeRestartTimer = null;


  /* =========================================================
     SAFE DATA LOADING
  ========================================================= */

  function loadData() {

    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {

        return structuredClone(defaultData);

      }

      const parsed = JSON.parse(saved);

      return {

        ...structuredClone(defaultData),

        ...parsed,

        learningProfile: {

          ...structuredClone(defaultData.learningProfile),

          ...(parsed.learningProfile || {}),

          skills: {
            ...(parsed.learningProfile?.skills || {})
          },

          recentTopics: [
            ...(parsed.learningProfile?.recentTopics || [])
          ],

          recentQuestions: [
            ...(parsed.learningProfile?.recentQuestions || [])
          ]

        },

        messages: Array.isArray(parsed.messages)
          ? parsed.messages
          : [],

        vocabulary: Array.isArray(parsed.vocabulary)
          ? parsed.vocabulary
          : [],

        mistakes: Array.isArray(parsed.mistakes)
          ? parsed.mistakes
          : []

      };

    } catch (error) {

      console.error(
        "Could not load saved data:",
        error
      );

      return structuredClone(defaultData);

    }

  }


  function saveData() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const levelSelect =
    document.getElementById("level");

  const topicSelect =
    document.getElementById("topic");

  const levelDescription =
    document.getElementById("levelDescription");

  const chat =
    document.getElementById("chat");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const voiceButton =
    document.getElementById("voiceButton");

  const handsFreeButton =
    document.getElementById("handsFreeButton");

  const newConversationButton =
    document.getElementById("newConversationButton");

  const status =
    document.getElementById("status");

  const answersCount =
    document.getElementById("answersCount");

  const correctionsCount =
    document.getElementById("correctionsCount");

  const wordsCount =
    document.getElementById("wordsCount");

  const streakCount =
    document.getElementById("streakCount");

  const vocabularyList =
    document.getElementById("vocabularyList");

  const mistakesList =
    document.getElementById("mistakesList");

  const learningProfileList =
    document.getElementById("learningProfileList");


  /* =========================================================
     LEVEL
  ========================================================= */

  function updateLevelDescription() {

    levelDescription.textContent =
      LEVEL_DESCRIPTIONS[data.level] ||
      LEVEL_DESCRIPTIONS.A1;

  }


  levelSelect.value = data.level;

  topicSelect.value = data.topic || "";

  updateLevelDescription();


  levelSelect.addEventListener(
    "change",
    () => {

      data.level =
        levelSelect.value;

      saveData();

      updateLevelDescription();

    }
  );


  topicSelect.addEventListener(
    "change",
    () => {

      data.topic =
        topicSelect.value;

      saveData();

    }
  );


  /* =========================================================
     STATUS
  ========================================================= */

  function setStatus(
    message,
    isError = false
  ) {

    status.textContent =
      message || "";

    status.className =
      isError
        ? "status error"
        : "status";

  }


  /* =========================================================
     RENDER CHAT
  ========================================================= */

  function renderChat() {

    chat.innerHTML = "";

    if (!data.messages.length) {

      const welcome =
        document.createElement("div");

      welcome.className =
        "message assistant";

      welcome.innerHTML =
        "<strong>Deutsch Coach:</strong><br>" +
        "Hallo! Wie geht es dir heute?";

      chat.appendChild(welcome);

      return;

    }


    data.messages.forEach(
      message => {

        const div =
          document.createElement("div");

        div.className =
          "message " +
          (
            message.role === "user"
              ? "user"
              : "assistant"
          );


        const speaker =
          message.role === "user"
            ? "Du"
            : "Deutsch Coach";


        div.innerHTML =
          "<strong>" +
          speaker +
          ":</strong><br>" +
          escapeHtml(message.content);


        if (
          message.translation &&
          message.role === "assistant"
        ) {

          div.innerHTML +=
            '<div class="translation">' +
            "🇬🇧 " +
            escapeHtml(
              message.translation
            ) +
            "</div>";

        }


        if (
          message.correction &&
          message.role === "assistant"
        ) {

          div.innerHTML +=
            '<div class="correction">' +
            "<strong>✏️ Korrektur:</strong><br>" +
            escapeHtml(
              message.correction
            );

          if (
            message.correctionExplanation
          ) {

            div.innerHTML +=
              "<br><br>" +
              escapeHtml(
                message.correctionExplanation
              );

          }

          div.innerHTML +=
            "</div>";

        }


        if (
          Array.isArray(message.vocabulary) &&
          message.vocabulary.length &&
          message.role === "assistant"
        ) {

          div.innerHTML +=
            '<div class="vocab">' +
            "<strong>📚 Neue Wörter:</strong><br>" +
            message.vocabulary
              .map(
                item =>
                  escapeHtml(item.word) +
                  " — " +
                  escapeHtml(item.meaning)
              )
              .join("<br>") +
            "</div>";

        }


        chat.appendChild(div);

      }
    );


    chat.scrollTop =
      chat.scrollHeight;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     PROGRESS
  ========================================================= */

  function renderProgress() {

    answersCount.textContent =
      data.sessions;

    correctionsCount.textContent =
      data.corrections;

    wordsCount.textContent =
      data.vocabulary.length;

    streakCount.textContent =
      data.streak;

  }


  /* =========================================================
     VOCABULARY
  ========================================================= */

  function renderVocabulary() {

    vocabularyList.innerHTML = "";

    if (!data.vocabulary.length) {

      vocabularyList.innerHTML =
        '<div class="empty">' +
        "Noch keine Wörter gespeichert." +
        "</div>";

      return;

    }


    data.vocabulary
      .slice()
      .reverse()
      .forEach(item => {

        const div =
          document.createElement("div");

        div.className =
          "word-item";

        div.innerHTML =
          "<strong>" +
          escapeHtml(item.word) +
          "</strong><br>" +
          '<span class="small">' +
          escapeHtml(item.meaning) +
          "</span>";

        vocabularyList.appendChild(div);

      });

  }


  /* =========================================================
     MISTAKES
  ========================================================= */

  function renderMistakes() {

    mistakesList.innerHTML = "";

    if (!data.mistakes.length) {

      mistakesList.innerHTML =
        '<div class="empty">' +
        "Noch keine Fehler gespeichert." +
        "</div>";

      return;

    }


    data.mistakes
      .slice()
      .reverse()
      .forEach(item => {

        const div =
          document.createElement("div");

        div.className =
          "mistake-item";

        div.innerHTML =
          "<strong>" +
          escapeHtml(item.correction) +
          "</strong><br>" +
          '<span class="small">' +
          "Original: " +
          escapeHtml(item.original) +
          " · " +
          item.count +
          "×" +
          "</span>";

        mistakesList.appendChild(div);

      });

  }


  /* =========================================================
     LEARNING PROFILE
  ========================================================= */

  function renderLearningProfile() {

    learningProfileList.innerHTML = "";

    const skills =
      Object.values(
        data.learningProfile.skills || {}
      );


    if (!skills.length) {

      learningProfileList.innerHTML =
        '<div class="empty">' +
        "Dein Lernprofil wird während des Gesprächs aufgebaut." +
        "</div>";

      return;

    }


    skills
      .sort(
        (a, b) =>
          (b.mistakes || 0) -
          (a.mistakes || 0)
      )
      .forEach(skill => {

        const div =
          document.createElement("div");

        div.className =
          "skill-item";


        let statusText =
          skill.status || "new";


        if (
          statusText === "mastered"
        ) {

          statusText =
            "gemeistert";

        } else if (
          statusText === "weak"
        ) {

          statusText =
            "üben";

        } else if (
          statusText === "developing"
        ) {

          statusText =
            "in Entwicklung";

        } else {

          statusText =
            "neu";

        }


        div.innerHTML =
          "<strong>" +
          escapeHtml(
            skill.label || skill.skillId
          ) +
          "</strong>" +
          '<span class="status-badge">' +
          escapeHtml(statusText) +
          "</span><br>" +
          '<span class="small">' +
          "Fehler: " +
          (skill.mistakes || 0) +
          " · Richtig: " +
          (skill.correctUses || 0) +
          "</span>";


        learningProfileList.appendChild(div);

      });

  }


  /* =========================================================
     LEARNING PROFILE UPDATE
  ========================================================= */

  function updateLearningProfile(
    learning
  ) {

    if (
      !learning ||
      !learning.skillId
    ) {

      return;

    }


    const skillId =
      learning.skillId;


    if (
      !data.learningProfile.skills[skillId]
    ) {

      data.learningProfile.skills[
        skillId
      ] = {

        skillId,

        label:
          learning.label ||
          skillId,

        mistakes: 0,

        correctUses: 0,

        status: "new",

        lastOutcome: "none",

        lastSeen:
          new Date().toISOString()

      };

    }


    const skill =
      data.learningProfile.skills[
        skillId
      ];


    if (learning.label) {

      skill.label =
        learning.label;

    }


    if (
      learning.outcome === "mistake"
    ) {

      skill.mistakes =
        (skill.mistakes || 0) + 1;

      skill.lastOutcome =
        "mistake";

    }


    if (
      learning.outcome === "correct"
    ) {

      skill.correctUses =
        (skill.correctUses || 0) + 1;

      skill.lastOutcome =
        "correct";

    }


    skill.lastSeen =
      new Date().toISOString();


    if (
      skill.mistakes >= 1 &&
      skill.correctUses >= 3
    ) {

      skill.status =
        "mastered";

    } else if (
      skill.mistakes >= 2
    ) {

      skill.status =
        "weak";

    } else if (
      skill.mistakes >= 1
    ) {

      skill.status =
        "developing";

    } else {

      skill.status =
        "new";

    }

  }


  /* =========================================================
     MEMORY FOR AI
  ========================================================= */

  function buildMemory() {

    const knownVocabulary =
      data.vocabulary
        .map(item => item.word)
        .slice(-100);


    const mistakes =
      data.mistakes
        .slice(-50)
        .map(item => ({

          original:
            item.original,

          correction:
            item.correction,

          count:
            item.count

        }));


    const skills =
      Object.values(
        data.learningProfile.skills || {}
      )
      .slice(-50)
      .map(skill => ({

        skillId:
          skill.skillId,

        label:
          skill.label,

        mistakes:
          skill.mistakes,

        correctUses:
          skill.correctUses,

        status:
          skill.status

      }));


    return {

      knownVocabulary,

      mistakes,

      skills,

      recentTopics:
        data.learningProfile.recentTopics
          .slice(-10),

      recentQuestions:
        data.learningProfile.recentQuestions
          .slice(-10)

    };

  }


  /* =========================================================
     ADD VOCABULARY
  ========================================================= */

  function addVocabulary(
    vocabulary
  ) {

    if (!Array.isArray(vocabulary)) {

      return;

    }


    vocabulary.forEach(item => {

      if (
        !item ||
        !item.word
      ) {

        return;

      }


      const exists =
        data.vocabulary.some(
          existing =>
            existing.word
              .toLowerCase() ===
            String(item.word)
              .toLowerCase()
        );


      if (!exists) {

        data.vocabulary.push({

          word:
            String(item.word),

          meaning:
            String(item.meaning || "")

        });

      }

    });


    if (
      data.vocabulary.length > 200
    ) {

      data.vocabulary =
        data.vocabulary.slice(-200);

    }

  }


  /* =========================================================
     ADD MISTAKE
  ========================================================= */

  function addMistake(
    original,
    correction
  ) {

    if (
      !original ||
      !correction
    ) {

      return;

    }


    const existing =
      data.mistakes.find(
        item =>
          item.original === original &&
          item.correction === correction
      );


    if (existing) {

      existing.count =
        (existing.count || 0) + 1;

    } else {

      data.mistakes.push({

        original,

        correction,

        count: 1

      });

    }


    if (
      data.mistakes.length > 100
    ) {

      data.mistakes =
        data.mistakes.slice(-100);

    }

  }


  /* =========================================================
     STUDY DAY
  ========================================================= */

  function updateStudyDay() {

    const today =
      new Date()
        .toISOString()
        .slice(0, 10);


    if (
      data.lastStudyDate === today
    ) {

      return;

    }


    if (!data.lastStudyDate) {

      data.streak = 1;

    } else {

      const previous =
        new Date(
          data.lastStudyDate +
          "T00:00:00"
        );

      const current =
        new Date(
          today +
          "T00:00:00"
        );


      const difference =
        Math.round(
          (
            current - previous
          ) /
          86400000
        );


      if (
        difference === 1
      ) {

        data.streak += 1;

      } else {

        data.streak = 1;

      }

    }


    data.lastStudyDate =
      today;

  }


  /* =========================================================
     SEND MESSAGE
  ========================================================= */

  async function sendMessage() {

    if (isSending) {

      return;

    }


    const text =
      messageInput.value.trim();


    if (!text) {

      return;

    }


    isSending = true;

    sendButton.disabled = true;

    voiceButton.disabled = true;


    setStatus(
      "⏳ Deutsch Coach denkt nach..."
    );


    data.messages.push({

      role: "user",

      content: text

    });


    data.sessions += 1;

    updateStudyDay();


    if (data.topic) {

      data.learningProfile
        .recentTopics
        .push(data.topic);

      data.learningProfile
        .recentTopics =
        data.learningProfile
          .recentTopics
          .slice(-10);

    }


    messageInput.value = "";

    saveData();

    renderChat();

    renderProgress();


    try {

      const response =
        await fetch(
          API_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              level:
                data.level,

              topic:
                data.topic,

              memory:
                buildMemory(),

              messages:
                data.messages.map(
                  message => ({

                    role:
                      message.role,

                    content:
                      message.content

                  })
                )

            })

          }
        );


      const rawText =
        await response.text();


      let result;


      try {

        result =
          JSON.parse(rawText);

      } catch (error) {

        throw new Error(
          rawText ||
          "Ungültige Antwort vom Server."
        );

      }


      if (!response.ok) {

        throw new Error(
          result.error ||
          result.message ||
          "Der AI-Service hat einen Fehler zurückgegeben."
        );

      }


      if (!result.reply) {

        throw new Error(
          "Keine Antwort vom Deutsch Coach erhalten."
        );

      }


      /* -----------------------------------------
         STORE ASSISTANT RESPONSE
      ----------------------------------------- */

      data.messages.push({

        role: "assistant",

        content:
          result.reply,

        translation:
          result.translation || "",

        correction:
          result.correction || "",

        correctionExplanation:
          result.correctionExplanation || "",

        correctionType:
          result.correctionType || "none",

        vocabulary:
          Array.isArray(result.vocabulary)
            ? result.vocabulary
            : [],

        learning:
          result.learning || null

      });


      if (result.correction) {

        data.corrections += 1;

        addMistake(
          text,
          result.correction
        );

      }


      addVocabulary(
        result.vocabulary
      );


      updateLearningProfile(
        result.learning
      );


      if (
        result.reply
      ) {

        data.learningProfile
          .recentQuestions
          .push(result.reply);

        data.learningProfile
          .recentQuestions =
          data.learningProfile
            .recentQuestions
            .slice(-10);

      }


      saveData();

      renderChat();

      renderProgress();

      renderVocabulary();

      renderMistakes();

      renderLearningProfile();


      setStatus("");


      /* -----------------------------------------
         IMPORTANT:
         SPEAK THE AI RESPONSE
      ----------------------------------------- */

      if (
        data.handsFree ||
        isListening
      ) {

        await speakGerman(
          result.reply
        );

      }


    } catch (error) {

      console.error(
        "sendMessage error:",
        error
      );


      setStatus(
        "Fehler: " +
        error.message,
        true
      );

    } finally {

      isSending = false;

      sendButton.disabled = false;

      voiceButton.disabled = false;

    }

  }


  /* =========================================================
     SPEECH SYNTHESIS
     
     IMPORTANT FIX:
     Cancel old speech first.
     Wait briefly before starting.
     Explicitly set German locale.
     Handle onstart/onend/onerror.
  ========================================================= */

  function speakGerman(
    text
  ) {

    return new Promise(
      resolve => {

        if (
          !("speechSynthesis" in window)
        ) {

          console.warn(
            "Speech synthesis is not supported."
          );

          resolve();

          return;

        }


        if (!text) {

          resolve();

          return;

        }


        isSpeaking = true;


        try {

          window.speechSynthesis.cancel();

        } catch (error) {

          console.warn(
            "Could not cancel speech:",
            error
          );

        }


        /*
         * Some mobile browsers, especially
         * Android Chrome, behave more reliably
         * when speech starts after a tiny delay.
         */

        setTimeout(
          () => {

            const utterance =
              new SpeechSynthesisUtterance(
                String(text)
              );


            utterance.lang =
              "de-DE";

            utterance.rate =
              0.92;

            utterance.pitch =
              1.0;

            utterance.volume =
              1.0;


            utterance.onstart =
              () => {

                isSpeaking = true;

                setStatus(
                  "🔊 Deutsch Coach spricht..."
                );

              };


            utterance.onend =
              () => {

                isSpeaking = false;

                setStatus("");

                resolve();

              };


            utterance.onerror =
              event => {

                console.warn(
                  "Speech synthesis error:",
                  event
                );

                isSpeaking = false;

                setStatus(
                  "Die Antwort wurde geschrieben, aber die Sprachausgabe konnte nicht gestartet werden.",
                  true
                );

                resolve();

              };


            try {

              window.speechSynthesis
                .speak(
                  utterance
                );

            } catch (error) {

              console.error(
                "Speech synthesis failed:",
                error
              );

              isSpeaking = false;

              resolve();

            }

          },

          150

        );

      }
    );

  }


  /* =========================================================
     VOICE RECOGNITION
  ========================================================= */

  function setupRecognition() {

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      voiceButton.disabled = true;

      voiceButton.textContent =
        "🎙️ Sprache nicht unterstützt";

      return;

    }


    recognition =
      new SpeechRecognition();


    recognition.lang =
      "de-DE";

    recognition.continuous =
      false;

    recognition.interimResults =
      false;


    recognition.onstart =
      () => {

        isListening = true;

        voiceButton.classList.add(
          "recording"
        );

        voiceButton.textContent =
          "🛑 Zuhören...";

        setStatus(
          "🎙️ Ich höre zu..."
        );

      };


    recognition.onresult =
      event => {

        const transcript =
          event.results[0][0].transcript;

        messageInput.value =
          transcript;

        setStatus(
          "✓ Verstanden: " +
          transcript
        );

        /*
         * Automatically send the
         * recognized German sentence.
         */

        setTimeout(
          () => {

            sendMessage();

          },

          150

        );

      };


    recognition.onerror =
      event => {

        console.error(
          "Speech recognition error:",
          event
        );

        isListening = false;

        voiceButton.classList.remove(
          "recording"
        );

        voiceButton.textContent =
          "🎙️ Sprechen";

        setStatus(
          "Spracherkennung: " +
          event.error,
          true
        );

      };


    recognition.onend =
      () => {

        isListening = false;

        voiceButton.classList.remove(
          "recording"
        );

        voiceButton.textContent =
          "🎙️ Sprechen";


        /*
         * If hands-free mode is enabled,
         * continue listening after the
         * coach has finished speaking.
         */

        if (
          data.handsFree &&
          !isSending &&
          !isSpeaking
        ) {

          scheduleHandsFreeListening();

        }

      };

  }


  /* =========================================================
     START VOICE
  ========================================================= */

  function startVoice() {

    if (!recognition) {

      setStatus(
        "Spracherkennung wird von diesem Browser nicht unterstützt.",
        true
      );

      return;

    }


    if (isSpeaking) {

      try {

        window.speechSynthesis.cancel();

      } catch (error) {}

      isSpeaking = false;

    }


    try {

      recognition.start();

    } catch (error) {

      console.warn(
        "Recognition could not start:",
        error
      );

    }

  }


  /* =========================================================
     HANDS-FREE LISTENING
  ========================================================= */

  function scheduleHandsFreeListening() {

    clearTimeout(
      handsFreeRestartTimer
    );


    handsFreeRestartTimer =
      setTimeout(
        () => {

          if (
            data.handsFree &&
            !isListening &&
            !isSpeaking &&
            !isSending
          ) {

            startVoice();

          }

        },

        700

      );

  }


  /* =========================================================
     HANDS-FREE BUTTON
  ========================================================= */

  function updateHandsFreeButton() {

    if (data.handsFree) {

      handsFreeButton.textContent =
        "🔄 Freisprechen: An";

      handsFreeButton.classList.add(
        "handsfree-on"
      );

    } else {

      handsFreeButton.textContent =
        "🔄 Freisprechen: Aus";

      handsFreeButton.classList.remove(
        "handsfree-on"
      );

    }

  }


  handsFreeButton.addEventListener(
    "click",
    () => {

      data.handsFree =
        !data.handsFree;

      saveData();

      updateHandsFreeButton();


      if (data.handsFree) {

        setStatus(
          "🔄 Freisprechen aktiviert."
        );

        /*
         * Start listening only after
         * the user explicitly enabled it.
         */

        if (
          !isListening &&
          !isSpeaking &&
          !isSending
        ) {

          scheduleHandsFreeListening();

        }

      } else {

        clearTimeout(
          handsFreeRestartTimer
        );

        setStatus(
          "Freisprechen deaktiviert."
        );

      }

    }
  );


  /* =========================================================
     VOICE BUTTON
  ========================================================= */

  voiceButton.addEventListener(
    "click",
    () => {

      if (isListening) {

        try {

          recognition.stop();

        } catch (error) {}

        return;

      }


      startVoice();

    }
  );


  /* =========================================================
     SEND BUTTON
  ========================================================= */

  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /* =========================================================
     NEW CONVERSATION
  ========================================================= */

  newConversationButton.addEventListener(
    "click",
    () => {

      if (
        !confirm(
          "Neues Gespräch starten? Dein Lernprofil, Wörter und Fehler bleiben erhalten."
        )
      ) {

        return;

      }


      clearTimeout(
        handsFreeRestartTimer
      );


      if (recognition) {

        try {

          recognition.stop();

        } catch (error) {}

      }


      if (
        "speechSynthesis" in window
      ) {

        try {

          window.speechSynthesis.cancel();

        } catch (error) {}

      }


      data.messages = [];

      data.sessions += 0;

      saveData();

      renderChat();

      setStatus(
        "Neues Gespräch gestartet."
      );

    }
  );


  /* =========================================================
     EXPORT
  ========================================================= */

  document
    .getElementById("exportButton")
    .addEventListener(
      "click",
      () => {

        const json =
          JSON.stringify(
            data,
            null,
            2
          );


        const blob =
          new Blob(
            [json],
            {
              type:
                "application/json"
            }
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement("a");

        link.href =
          url;

        link.download =
          "deutsch-coach-backup.json";

        link.click();

        URL.revokeObjectURL(
          url
        );

      }
    );


  /* =========================================================
     IMPORT
  ========================================================= */

  const importFile =
    document.getElementById(
      "importFile"
    );


  document
    .getElementById("importButton")
    .addEventListener(
      "click",
      () => {

        importFile.click();

      }
    );


  importFile.addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];


      if (!file) {

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        () => {

          try {

            const imported =
              JSON.parse(
                reader.result
              );


            data = {

              ...structuredClone(
                defaultData
              ),

              ...imported,

              learningProfile: {

                ...structuredClone(
                  defaultData.learningProfile
                ),

                ...(imported.learningProfile || {}),

                skills:
                  imported.learningProfile?.skills || {},

                recentTopics:
                  imported.learningProfile?.recentTopics || [],

                recentQuestions:
                  imported.learningProfile?.recentQuestions || []

              }

            };


            levelSelect.value =
              data.level;

            topicSelect.value =
              data.topic || "";


            updateLevelDescription();

            saveData();

            renderAll();

            setStatus(
              "Daten erfolgreich importiert."
            );

          } catch (error) {

            setStatus(
              "Die Datei konnte nicht importiert werden.",
              true
            );

          }

        };


      reader.readAsText(
        file
      );

    }
  );


  /* =========================================================
     DELETE DATA
  ========================================================= */

  document
    .getElementById("deleteDataButton")
    .addEventListener(
      "click",
      () => {

        if (
          !confirm(
            "Wirklich ALLE Deutsch-Coach-Daten löschen?"
          )
        ) {

          return;

        }


        localStorage.removeItem(
          STORAGE_KEY
        );


        data =
          structuredClone(
            defaultData
          );


        levelSelect.value =
          data.level;

        topicSelect.value =
          data.topic;


        updateLevelDescription();

        renderAll();

        setStatus(
          "Alle Daten wurden gelöscht."
        );

      }
    );


  /* =========================================================
     RENDER EVERYTHING
  ========================================================= */

  function renderAll() {

    renderChat();

    renderProgress();

    renderVocabulary();

    renderMistakes();

    renderLearningProfile();

    updateHandsFreeButton();

  }


  /* =========================================================
     INITIALIZE
  ========================================================= */

  setupRecognition();

  renderAll();

</script>
