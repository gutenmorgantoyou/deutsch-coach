<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deutsch Coach 🇩🇪</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .level-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .level-title {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .level-select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 18px;
            background: white;
        }

        .conversation-title {
            font-size: 15px;
            color: #777;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .message {
            margin-bottom: 18px;
        }

        .message .speaker {
            font-size: 13px;
            color: #777;
            margin-bottom: 5px;
        }

        .message .bubble {
            background: white;
            border-radius: 12px;
            padding: 14px;
            line-height: 1.5;
            font-size: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .message.user .bubble {
            background: #e3f2fd;
        }

        .message.coach .bubble {
            background: #eeeeee;
        }

        .translation {
            font-size: 14px;
            color: #666;
            margin-top: 6px;
            padding-left: 4px;
            line-height: 1.4;
        }

        .correction {
            margin-top: 8px;
            padding: 10px;
            background: #fff8e1;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .correction strong {
            color: #8a6500;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 20px;
            background: #1976d2;
            color: white;
            cursor: pointer;
            margin-top: 8px;
        }

        button.listening {
            background: #d32f2f;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            text-align: center;
            margin-top: 16px;
            color: #666;
        }

        .level-description {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
            line-height: 1.4;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🇩🇪 Deutsch Coach</h1>


    <!-- LEVEL SELECTOR -->

    <div class="level-card">

        <div class="level-title">
            🎯 Dein Deutsch-Niveau
        </div>

        <select
            id="levelSelect"
            class="level-select"
        >

            <option value="A1">
                A1 – Anfänger
            </option>

            <option value="A2">
                A2 – Grundkenntnisse
            </option>

            <option value="B1">
                B1 – Mittelstufe
            </option>

            <option value="B2">
                B2 – Gute Mittelstufe
            </option>

            <option value="C1">
                C1 – Fortgeschritten
            </option>

            <option value="C2">
                C2 – Nahezu muttersprachlich
            </option>

        </select>

        <div
            id="levelDescription"
            class="level-description"
        >
            Einfache Wörter und kurze Sätze.
        </div>

    </div>


    <div class="conversation-title">
        Gespräch
    </div>


    <div id="conversation">

        <div class="message coach">

            <div class="speaker">
                Deutsch Coach
            </div>

            <div class="bubble">
                Hallo! Wie geht es dir heute?
            </div>

            <div class="translation">
                🇬🇧 Hello! How are you today?
            </div>

        </div>

    </div>


    <button id="speakButton">
        🎙️ Sprechen
    </button>


    <div id="status">
        Bereit
    </div>

</div>


<script>

const speakButton =
    document.getElementById("speakButton");

const status =
    document.getElementById("status");

const conversation =
    document.getElementById("conversation");

const levelSelect =
    document.getElementById("levelSelect");

const levelDescription =
    document.getElementById("levelDescription");


/*
 * Cloudflare Worker
 */

const API_URL =
    "https://deutsch-coach-api.gutenmorgantoyou.workers.dev";


/*
 * Current German level.
 */

let currentLevel =
    localStorage.getItem(
        "deutschCoachLevel"
    ) || "A1";


levelSelect.value =
    currentLevel;


/*
 * Level descriptions.
 */

const descriptions = {

    A1:
        "Einfache Wörter und kurze Sätze.",

    A2:
        "Einfache Gespräche über Alltag und bekannte Themen.",

    B1:
        "Normale Gespräche mit etwas komplexeren Sätzen.",

    B2:
        "Natürlichere Gespräche mit vielfältigem Wortschatz.",

    C1:
        "Anspruchsvolle Gespräche mit komplexerem Deutsch.",

    C2:
        "Sehr fortgeschrittenes, nahezu muttersprachliches Deutsch."

};


levelDescription.textContent =
    descriptions[currentLevel];


/*
 * Conversation memory.
 *
 * IMPORTANT:
 * Only German conversation goes here.
 * English translations are NOT stored.
 */

const messages = [

    {
        role: "assistant",
        content:
            "Hallo! Wie geht es dir heute?"
    }

];


/*
 * Change level.
 */

levelSelect.onchange =
    () => {

        currentLevel =
            levelSelect.value;


        localStorage.setItem(
            "deutschCoachLevel",
            currentLevel
        );


        levelDescription.textContent =
            descriptions[currentLevel];


        status.textContent =
            "Niveau " +
            currentLevel +
            " ausgewählt.";

    };


/*
 * Add visible message.
 */

function addMessage(
    speaker,
    text,
    type,
    translation = "",
    correction = ""
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const speakerElement =
        document.createElement("div");

    speakerElement.className =
        "speaker";

    speakerElement.textContent =
        speaker;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(
        speakerElement
    );

    message.appendChild(
        bubble
    );


    /*
     * English translation.
     */

    if (translation) {

        const translationElement =
            document.createElement("div");

        translationElement.className =
            "translation";

        translationElement.textContent =
            "🇬🇧 " + translation;

        message.appendChild(
            translationElement
        );

    }


    /*
     * Optional correction.
     */

    if (correction) {

        const correctionElement =
            document.createElement("div");

        correctionElement.className =
            "correction";

        correctionElement.innerHTML =
            "<strong>✏️ Korrektur:</strong> " +
            escapeHtml(correction);

        message.appendChild(
            correctionElement
        );

    }


    conversation.appendChild(
        message
    );


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


/*
 * Protect displayed correction text.
 */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/*
 * Translate German to English.
 */

async function translateToEnglish(text) {

    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    translate:
                        true,

                    text:
                        text

                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Translation error"
            );

        }


        return (
            data.translation ||
            "Translation unavailable."
        ).trim();


    } catch (error) {

        console.error(
            "Translation error:",
            error
        );

        return "Translation unavailable.";

    }

}


/*
 * Speak German.
 */

function speakGerman(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.lang =
        "de-DE";

    speech.rate =
        0.9;

    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/*
 * Ask Coach.
 */

async function askCoach() {

    status.textContent =
        "🤔 Ich denke...";

    speakButton.disabled =
        true;


    try {

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    messages:
                        messages,

                    level:
                        currentLevel

                })

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Server error"
            );

        }


        if (!data.reply) {

            throw new Error(
                "Keine Antwort vom Coach."
            );

        }


        /*
         * Store ONLY the German AI response.
         */

        messages.push({

            role:
                "assistant",

            content:
                data.reply

        });


        /*
         * Translate the AI response.
         */

        const translation =
            await translateToEnglish(
                data.reply
            );


        /*
         * Display AI response.
         */

        addMessage(

            "Deutsch Coach",

            data.reply,

            "coach",

            translation,

            data.correction || ""

        );


        /*
         * Speak German.
         */

        speakGerman(
            data.reply
        );


        status.textContent =
            "Bereit";


    } catch (error) {

        console.error(error);


        status.textContent =
            "Fehler: " +
            error.message;


    } finally {

        speakButton.disabled =
            false;

    }

}


/*
 * Speech recognition.
 */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
        "Spracherkennung wird von diesem Browser nicht unterstützt.";

    speakButton.disabled =
        true;


} else {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "de-DE";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    /*
     * Start listening.
     */

    speakButton.onclick =
        () => {

            try {

                window.speechSynthesis.cancel();


                recognition.start();


                speakButton.classList.add(
                    "listening"
                );


                speakButton.textContent =
                    "🎙️ Zuhören...";


                status.textContent =
                    "Ich höre zu...";


            } catch (error) {

                console.error(error);

            }

        };


    /*
     * Speech recognized.
     */

    recognition.onresult =
        async (event) => {

            const text =
                event
                    .results[0][0]
                    .transcript
                    .trim();


            if (!text) {

                return;

            }


            /*
             * Store learner's German.
             *
             * English translation is NOT stored.
             */

            messages.push({

                role:
                    "user",

                content:
                    text

            });


            /*
             * Translate learner message.
             */

            const translation =
                await translateToEnglish(
                    text
                );


            /*
             * Show learner message.
             */

            addMessage(

                "Du",

                text,

                "user",

                translation

            );


            /*
             * Ask AI.
             */

            await askCoach();

        };


    /*
     * Recognition errors.
     */

    recognition.onerror =
        (event) => {

            console.log(
                "Speech error:",
                event.error
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                status.textContent =
                    "Mikrofonzugriff wurde verweigert.";

            } else if (
                event.error ===
                "no-speech"
            ) {

                status.textContent =
                    "Ich habe nichts gehört.";

            } else {

                status.textContent =
                    "Fehler: " +
                    event.error;

            }

        };


    /*
     * Recognition ended.
     */

    recognition.onend =
        () => {

            speakButton.classList.remove(
                "listening"
            );


            speakButton.textContent =
                "🎙️ Sprechen";

        };

}

</script>

</body>
</html>
