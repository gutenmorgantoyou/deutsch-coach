<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deutsch Coach 🇩🇪</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .label {
            font-size: 14px;
            color: #777;
            margin-bottom: 8px;
        }

        .text {
            font-size: 20px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 20px;
            background: #1976d2;
            color: white;
            cursor: pointer;
        }

        button.listening {
            background: #d32f2f;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #newConversationButton {
            margin-top: 12px;
            background: #757575;
        }

        #status {
            text-align: center;
            margin-top: 16px;
            color: #666;
        }

        #conversation {
            margin-top: 20px;
        }

        .message {
            margin-bottom: 14px;
        }

        .message .speaker {
            font-size: 13px;
            color: #777;
            margin-bottom: 4px;
        }

        .message .bubble {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            line-height: 1.5;
            font-size: 18px;
        }

        .message.user .bubble {
            background: #e3f2fd;
        }

        .message.coach .bubble {
            background: #eeeeee;
        }

    </style>
</head>

<body>

<div class="app">

    <h1>🇩🇪 Deutsch Coach</h1>

    <div id="conversation">

        <div class="message coach">

            <div class="speaker">
                Deutsch Coach
            </div>

            <div class="bubble">
                Hallo! Wie geht es dir heute?
            </div>

        </div>

    </div>


    <button id="speakButton">
        🎙️ Sprechen
    </button>


    <button id="newConversationButton">
        🔄 Neue Unterhaltung
    </button>


    <div id="status">
        Bereit
    </div>

</div>


<script>


const speakButton =
    document.getElementById("speakButton");

const newConversationButton =
    document.getElementById("newConversationButton");

const status =
    document.getElementById("status");

const conversation =
    document.getElementById("conversation");


/*
 * Cloudflare Worker
 */

const API_URL =
    "https://deutsch-coach-api.gutenmorgantoyou.workers.dev";


/*
 * Initial coach message
 */

const INITIAL_MESSAGE =
    "Hallo! Wie geht es dir heute?";


/*
 * Conversation history
 */

let messages = [

    {
        role: "assistant",
        content: INITIAL_MESSAGE
    }

];


/*
 * Add a message to the screen
 */

function addMessage(
    speaker,
    text,
    type
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const speakerElement =
        document.createElement("div");

    speakerElement.className =
        "speaker";

    speakerElement.textContent =
        speaker;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    message.appendChild(
        speakerElement
    );

    message.appendChild(
        bubble
    );


    conversation.appendChild(
        message
    );


    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


/*
 * Speak German using the
 * phone's speech synthesis
 */

function speakGerman(text) {

    if (
        !("speechSynthesis" in window)
    ) {
        return;
    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(text);


    speech.lang =
        "de-DE";


    speech.rate =
        0.9;


    speech.pitch =
        1;


    window.speechSynthesis.speak(
        speech
    );

}


/*
 * Ask the AI coach
 */

async function askCoach() {

    status.textContent =
        "🤔 Ich denke...";


    speakButton.disabled =
        true;


    try {

        const response =
            await fetch(

                API_URL,

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            messages:
                                messages

                        })

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(

                data.error ||
                "Server error"

            );

        }


        if (!data.reply) {

            throw new Error(
                "Keine Antwort vom Coach."
            );

        }


        /*
         * Add coach response
         * to conversation history
         */

        messages.push({

            role:
                "assistant",

            content:
                data.reply

        });


        /*
         * Display coach response
         */

        addMessage(

            "Deutsch Coach",

            data.reply,

            "coach"

        );


        /*
         * Speak coach response
         */

        speakGerman(
            data.reply
        );


        status.textContent =
            "Bereit";


    } catch (error) {

        console.error(error);


        status.textContent =
            "Fehler: " +
            error.message;


    } finally {

        speakButton.disabled =
            false;

    }

}


/*
 * Start a new conversation
 */

newConversationButton.onclick =
    () => {

        window.speechSynthesis.cancel();


        messages = [

            {

                role:
                    "assistant",

                content:
                    INITIAL_MESSAGE

            }

        ];


        conversation.innerHTML = "";


        addMessage(

            "Deutsch Coach",

            INITIAL_MESSAGE,

            "coach"

        );


        status.textContent =
            "Neue Unterhaltung gestartet.";

    };


/*
 * Speech recognition
 */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
        "Spracherkennung wird von diesem Browser nicht unterstützt.";


    speakButton.disabled =
        true;


} else {

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "de-DE";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    /*
     * Start listening
     */

    speakButton.onclick =
        () => {

            try {

                window.speechSynthesis.cancel();


                recognition.start();


                speakButton.classList.add(
                    "listening"
                );


                speakButton.textContent =
                    "🎙️ Zuhören...";


                status.textContent =
                    "Ich höre zu...";


            } catch (error) {

                console.error(error);

            }

        };


    /*
     * Speech recognized
     */

    recognition.onresult =
        async (event) => {

            const text =
                event
                    .results[0][0]
                    .transcript;


            /*
             * Add learner message
             * exactly once
             */

            messages.push({

                role:
                    "user",

                content:
                    text

            });


            /*
             * Display learner message
             */

            addMessage(

                "Du",

                text,

                "user"

            );


            /*
             * Ask coach
             */

            await askCoach();

        };


    /*
     * Speech recognition errors
     */

    recognition.onerror =
        (event) => {

            console.log(

                "Speech error:",

                event.error

            );


            if (
                event.error ===
                "not-allowed"
            ) {

                status.textContent =
                    "Mikrofonzugriff wurde verweigert.";

            }

            else if (
                event.error ===
                "no-speech"
            ) {

                status.textContent =
                    "Ich habe nichts gehört.";

            }

            else {

                status.textContent =
                    "Fehler: " +
                    event.error;

            }

        };


    /*
     * Recognition finished
     */

    recognition.onend =
        () => {

            speakButton.classList.remove(
                "listening"
            );


            speakButton.textContent =
                "🎙️ Sprechen";

        };

}

</script>

</body>
</html>
